spring.application.name=dzimbahub-backend

# Fixed port from 5432 (Database) to 8080 (Web App)
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Converted your postgres:// URI to a Spring Boot JDBC URL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===============================
# APP CONFIG
# ===============================
app.jwt.secret=${APP_JWT_SECRET:local-development-only-secret-change-this-32chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
